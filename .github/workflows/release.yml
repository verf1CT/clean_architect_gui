name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_name: clean_architect_gui-macos.zip
            build_path: build/macos/Build/Products/Release/clean_architect_gui.app
          - os: windows-latest
            target: windows
            artifact_name: clean_architect_gui-windows.zip
            build_path: build/windows/x64/runner/Release
          - os: ubuntu-latest
            target: linux
            artifact_name: clean_architect_gui-linux.tar.gz
            build_path: build/linux/x64/release/bundle
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Desktop Support
        run: |
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - name: Archive macOS
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --keepParent ${{ matrix.build_path }} ${{ matrix.artifact_name }}

      - name: Archive Windows
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ${{ matrix.build_path }}\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Archive Linux
        if: matrix.os == 'ubuntu-latest'
        run: tar -czvf ${{ matrix.artifact_name }} -C build/linux/x64/release/bundle .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
